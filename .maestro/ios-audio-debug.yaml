    visible: "Audio: none | Music: on/started | SFX: off | Water: idle"
    timeout: 5000
- assertVisible: "Audio: none | Music: on/started | SFX: off | Water: idle"
- tapOn: "开启倒水音效"
- assertVisible: "关闭倒水音效"
