url: http://localhost:5201/?debugAudio=1
---
- launchApp
- extendedWaitUntil:
    visible: "开启背景音乐"
    timeout: 12000
- assertVisible: "Audio: none | Music: off/stopped | SFX: off | Water: idle"
- tapOn: "开启背景音乐"
