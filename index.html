<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魔彩瓶：颜色倒水</title>
  <meta name="description" content="魔彩瓶是一款可爱魔性的颜色倒水闯关小游戏，支持简单模式、困难模式和双语教学朗读。">
  <meta property="og:title" content="魔彩瓶：颜色倒水">
  <meta property="og:description" content="请将相同颜色的水倒在一起，挑战你的观察力和整理力。">
  <meta property="og:image" content="assets/brand/mocaiping-cover.png">
  <meta name="theme-color" content="#ed86b8">
  <link rel="icon" href="favicon.ico" sizes="any">
  <style>
    :root {
      color-scheme: light;
      --pink: #ed86b8;
      --pink-soft: #f6a6ca;
      --sky: #39aeea;
      --ink: #243044;
      --glass: rgba(255, 255, 255, 0.18);
      --app-height: 100svh;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: var(--pink);
      color: var(--ink);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: var(--app-height);
      overflow: hidden;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 14% 17%, rgba(255, 255, 255, 0.3) 0 18px, transparent 19px),
        radial-gradient(circle at 48% 15%, rgba(255, 255, 255, 0.23) 0 24px, transparent 25px),
        radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.24) 0 22px, transparent 23px),
        linear-gradient(180deg, #df7fb0 0%, var(--pink-soft) 66%, #48b9ef 66%, #34a8e5 100%);
    }

    .game-shell {
      width: min(100vw, 440px);
      height: min(var(--app-height), 780px);
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 12% 74%, rgba(255, 255, 255, 0.25) 0 21px, transparent 22px),
        radial-gradient(circle at 72% 78%, rgba(255, 255, 255, 0.2) 0 26px, transparent 27px),
        linear-gradient(180deg, var(--pink) 0%, var(--pink-soft) 72%, #48b8ee 72%, var(--sky) 100%);
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow: 0 24px 70px rgba(64, 42, 71, 0.24);
    }

    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      padding: 16px 16px 8px;
      color: #fff;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
      text-shadow: 0 2px 10px rgba(98, 32, 69, 0.26);
    }

    .brand-title {
      display: inline-block;
      margin-right: 2px;
      -webkit-text-stroke: 1.2px #fff;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.75),
        0 4px 0 rgba(139, 54, 126, 0.14);
    }

    .brand-title span:nth-child(1) {
      color: #8a45dd;
    }

    .brand-title span:nth-child(2) {
      color: #ff5f79;
    }

    .brand-title span:nth-child(3) {
      color: #35aaf0;
    }

    .rainbow-title {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0 4px;
      max-width: 100%;
      font-size: min(5.9vw, 24px);
      line-height: 1.14;
      font-weight: 1000;
      -webkit-text-stroke: 1.6px #fff;
      paint-order: stroke fill;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.8),
        0 4px 8px rgba(117, 40, 93, 0.22);
    }

    .rainbow-title .title-word:nth-child(1) {
      color: #ffe45c;
    }

    .rainbow-title .title-word:nth-child(2) {
      color: #ff6f98;
    }

    .rainbow-title .title-word:nth-child(3) {
      color: #48c9f4;
    }

    .rainbow-title .title-word:nth-child(4) {
      color: #59dd87;
    }

    .rainbow-title .title-word:nth-child(5) {
      color: #8a58f0;
    }

    .rainbow-title .title-word:nth-child(6) {
      color: #ff9a38;
    }

    .title-break {
      flex-basis: 100%;
      height: 0;
    }

    .meta {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    .chip,
    .status {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.26);
      color: #fff;
      backdrop-filter: blur(8px);
    }

    .chip {
      flex: 0 0 auto;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    #moves {
      min-width: 94px;
    }

    #timer {
      min-width: 88px;
    }

    #ruleTag {
      min-width: 78px;
    }

    .status {
      min-width: 76px;
      font-size: 13px;
      font-weight: 900;
      align-self: start;
    }

    .settings-button {
      width: 44px;
      min-height: 44px;
      align-self: start;
      padding: 0;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.34);
      color: #fff;
      box-shadow: 0 4px 0 rgba(149, 62, 122, 0.2);
      backdrop-filter: blur(8px);
    }

    .settings-button svg {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 2px 2px rgba(116, 46, 94, 0.22));
    }

    canvas {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: block;
      touch-action: manipulation;
      cursor: pointer;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      padding: 12px 12px 16px;
      background: #39aeea;
      border-top: 3px solid rgba(29, 121, 184, 0.42);
    }

    .volume-control {
      grid-column: 1 / -1;
      min-height: 34px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    .volume-control input {
      width: 100%;
      margin: 0;
      accent-color: #ff6b9a;
    }

    .volume-value {
      text-align: right;
    }

    .settings-panel {
      position: absolute;
      inset: 0;
      display: grid;
      align-items: stretch;
      background: rgba(31, 49, 73, 0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      z-index: 4;
    }

    .settings-panel.open {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-card {
      display: grid;
      align-content: start;
      grid-auto-rows: max-content;
      gap: 12px;
      padding: 16px;
      height: 100%;
      width: min(100%, 420px);
      margin: 0 auto;
      max-height: none;
      box-sizing: border-box;
      overflow-y: auto;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 253, 255, 0.96));
      border-radius: 8px;
      box-shadow: 0 -16px 40px rgba(48, 76, 105, 0.22);
      transform: translateY(12px);
      transition: transform 160ms ease;
    }

    .settings-panel.open .settings-card {
      transform: translateY(0);
    }

    .settings-head,
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settings-head {
      padding: 2px 0 4px;
    }

    .settings-title {
      margin: 0;
      color: #a33f73;
      font-size: 18px;
      font-weight: 900;
    }

    .settings-close {
      width: 48px;
      min-height: 34px;
      box-shadow: none;
      background: #dff3ff;
      color: #197dad;
    }

    .settings-label {
      color: #197dad;
      font-size: 14px;
      font-weight: 900;
    }

    .settings-group {
      display: grid;
      gap: 10px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(222, 243, 255, 0.72);
    }

    .settings-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(222, 243, 255, 0.78);
      box-shadow: inset 0 0 0 1px rgba(25, 125, 173, 0.08);
    }

    .settings-tabs button {
      min-height: 34px;
      border-radius: 999px;
      background: transparent;
      color: #197dad;
      box-shadow: none;
    }

    .settings-tabs button.active {
      background: #ff6fa6;
      color: #fff;
      box-shadow: 0 3px 8px rgba(196, 61, 125, 0.18);
    }

    .settings-section {
      display: none;
    }

    .settings-section.active {
      display: grid;
    }

    .settings-group-title {
      margin: 0;
      color: #a33f73;
      font-size: 13px;
      font-weight: 1000;
    }

    .settings-card .volume-control {
      min-height: 38px;
      grid-template-columns: 52px minmax(0, 1fr) 48px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.64);
      color: #197dad;
      box-shadow: inset 0 0 0 1px rgba(25, 125, 173, 0.08);
    }

    .settings-card .volume-control > span:first-child,
    .settings-card .volume-value {
      color: #197dad;
      font-size: 13px;
      font-weight: 1000;
      text-shadow: none;
    }

    .settings-card .volume-control input {
      height: 22px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .level-grid button {
      min-height: 36px;
      font-size: 12px;
      line-height: 1.15;
      background: #dff3ff;
      color: #197dad;
      box-shadow: 0 3px 0 rgba(24, 121, 171, 0.16);
    }

    .level-grid button.active {
      background: #ff6fa6;
      color: #fff;
      box-shadow: 0 3px 0 rgba(196, 61, 125, 0.28);
    }

    .level-grid button.locked {
      opacity: 0.58;
      color: #88a9bd;
      box-shadow: none;
    }

    .settings-action {
      min-width: 108px;
      box-shadow: 0 4px 0 rgba(24, 121, 171, 0.18);
    }

    .settings-action.is-on {
      background: #ff6fa6;
      color: #fff;
      box-shadow: 0 4px 0 rgba(196, 61, 125, 0.28);
    }

    .settings-action.is-off {
      background: #dff3ff;
      color: #197dad;
      box-shadow: 0 4px 0 rgba(24, 121, 171, 0.18);
    }

    .language-switch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .language-switch.two {
      grid-template-columns: repeat(2, 1fr);
    }

    .language-switch button {
      min-height: 40px;
      background: #dff3ff;
      color: #197dad;
      box-shadow: 0 4px 0 rgba(24, 121, 171, 0.16);
    }

    .language-switch button.active {
      background: #ff6fa6;
      color: #fff;
      box-shadow: 0 4px 0 rgba(196, 61, 125, 0.28);
    }

    .result-panel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(31, 49, 73, 0.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      z-index: 3;
    }

    .result-panel.open {
      opacity: 1;
      pointer-events: auto;
    }

    .result-card {
      width: min(100%, 340px);
      display: grid;
      gap: 10px;
      padding: 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      color: #197dad;
      text-align: center;
      box-shadow: 0 18px 42px rgba(63, 65, 93, 0.24);
      transform: translateY(10px) scale(0.98);
      transition: transform 160ms ease;
    }

    .result-panel.open .result-card {
      transform: translateY(0) scale(1);
    }

    .result-title {
      margin: 0;
      color: #e8428d;
      font-size: 28px;
      font-weight: 1000;
    }

    .result-stars {
      color: #ffb12f;
      font-size: 28px;
      letter-spacing: 2px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9);
    }

    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 13px;
      font-weight: 900;
    }

    .result-stats span {
      padding: 9px 8px;
      border-radius: 8px;
      background: #e8f7ff;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .result-actions button {
      min-height: 42px;
    }

    .result-actions .primary {
      background: #42bdf2;
      color: #fff;
      box-shadow: 0 4px 0 rgba(24, 121, 171, 0.28);
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mode-switch button {
      box-shadow: 0 4px 0 rgba(24, 121, 171, 0.16);
    }

    .mode-switch button.active {
      background: #ff6fa6;
      color: #fff;
      box-shadow: 0 4px 0 rgba(196, 61, 125, 0.28);
    }

    .cover-intro {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.28) 0 25px, transparent 26px),
        radial-gradient(circle at 82% 75%, rgba(255, 255, 255, 0.2) 0 32px, transparent 33px),
        linear-gradient(180deg, #ed86b8 0%, #f6a6ca 64%, #48b8ee 64%, #39aeea 100%);
      transition: opacity 260ms ease;
    }

    .cover-intro.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .cover-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      aspect-ratio: auto;
      width: 50%;
      z-index: 2;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.18) 0 20px, transparent 21px),
        linear-gradient(180deg, rgba(255, 136, 193, 0.18), rgba(61, 181, 235, 0.14));
      transition: transform 900ms cubic-bezier(0.74, 0, 0.2, 1);
      will-change: transform;
    }

    .cover-panel.left {
      left: 0;
      background-position: left center;
    }

    .cover-panel.right {
      left: auto;
      right: 0;
    }

    .cover-intro.opening .cover-panel.left {
      transform: translateX(-104%);
    }

    .cover-intro.opening .cover-panel.right {
      transform: translateX(104%);
    }

    .cover-shine {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(115deg, transparent 0 38%, rgba(255, 255, 255, 0.34) 48%, transparent 58% 100%);
      transform: translateX(-80%);
      animation: coverShine 1200ms ease 220ms both;
      pointer-events: none;
    }

    .cover-art {
      position: absolute;
      inset: 0;
      width: 100%;
      object-fit: cover;
      object-position: center;
      content: url("assets/brand/mocaiping-cover-mobile.png");
    }

    @media (min-width: 700px) and (min-aspect-ratio: 1 / 1) {
      .cover-intro {
        padding: 18px;
      }

      .cover-panel {
        top: 18px;
        bottom: 18px;
        width: calc(50% - 18px);
      }

      .cover-panel.left {
        left: 18px;
        border-radius: 8px 0 0 8px;
      }

      .cover-panel.right {
        right: 18px;
        border-radius: 0 8px 8px 0;
      }

      .cover-art {
        inset: 18px;
        width: calc(100% - 36px);
        height: calc(100% - 36px);
        padding: 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.24);
        box-shadow: 0 18px 50px rgba(89, 43, 95, 0.2);
        content: url("assets/brand/mocaiping-cover-desktop.png");
      }
    }

    @keyframes coverShine {
      from {
        transform: translateX(-80%);
      }

      to {
        transform: translateX(80%);
      }
    }

    @media (max-width: 540px) {
      body {
        place-items: start center;
      }

      .game-shell {
        width: 100vw;
        height: var(--app-height);
        max-height: var(--app-height);
        border: 0;
        box-shadow: none;
      }

      .topbar {
        padding: 12px 14px 6px;
      }

      .toolbar {
        padding: 9px 10px max(11px, env(safe-area-inset-bottom));
      }

      button {
        min-height: 40px;
      }
    }

    button {
      min-width: 0;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      color: #197dad;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(24, 121, 171, 0.28);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(24, 121, 171, 0.28);
    }

    button:disabled {
      cursor: default;
      opacity: 0.58;
      transform: none;
    }

    button[disabled] {
      opacity: 0.45;
      cursor: default;
    }

    .toast {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 74px;
      min-height: 40px;
      display: grid;
      place-items: center;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      color: #a33f73;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.35;
      white-space: pre-line;
      box-shadow: 0 12px 28px rgba(98, 32, 69, 0.16);
      opacity: 0;
      transform: translateY(-8px);
      transition: 180ms ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 380px) {
      .game-shell {
        height: var(--app-height);
      }

      h1 {
        font-size: 16px;
      }

      button {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="status" id="status">第 1 关</div>
      <div>
        <h1>
          <span class="rainbow-title" aria-label="请将相同颜色的水倒在一起">
            <span class="title-word">请将</span>
            <span class="title-word">相同颜色</span>
            <span class="title-word">的水</span>
            <span class="title-break" aria-hidden="true"></span>
            <span class="title-word">倒在</span>
            <span class="title-word">一起</span>
          </span>
        </h1>
        <div class="meta">
          <span class="chip" id="moves">步数 0</span>
          <span class="chip" id="timer">不限时</span>
          <span class="chip" id="ruleTag">经典</span>
        </div>
      </div>
      <button class="settings-button" type="button" id="settings" title="打开设置" aria-label="打开设置">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.9 2.9h2.2l.5 2.3c.5.2 1 .4 1.5.7l2-1.2 1.6 1.6-1.2 2c.3.5.5 1 .7 1.5l2.3.5v2.2l-2.3.5c-.2.5-.4 1-.7 1.5l1.2 2-1.6 1.6-2-1.2c-.5.3-1 .5-1.5.7l-.5 2.3h-2.2l-.5-2.3c-.5-.2-1-.4-1.5-.7l-2 1.2-1.6-1.6 1.2-2c-.3-.5-.5-1-.7-1.5l-2.3-.5v-2.2l2.3-.5c.2-.5.4-1 .7-1.5l-1.2-2 1.6-1.6 2 1.2c.5-.3 1-.5 1.5-.7l.5-2.3Z" fill="#fff" opacity=".98"/>
          <circle cx="12" cy="12" r="3.5" fill="#39aeea"/>
          <circle cx="12" cy="12" r="1.45" fill="#fff"/>
        </svg>
      </button>
    </header>

    <canvas id="game" aria-label="颜色倒水游戏画布"></canvas>
    <div class="toast" id="toast"></div>

    <footer class="toolbar">
      <button type="button" id="undo" title="撤销上一步">撤销</button>
      <button type="button" id="hint" title="给出一步提示">提示</button>
      <button type="button" id="restart" title="重新开始当前关">重开</button>
      <button type="button" id="audioToggle" title="开关音乐和音效">开启音乐/音效</button>
    </footer>
    <div class="result-panel" id="resultPanel" aria-hidden="true">
      <div class="result-card" role="dialog" aria-modal="true" aria-label="通关结果">
        <p class="result-title" id="resultTitle">恭喜通关</p>
        <div class="result-stars" id="resultStars">★★★</div>
        <div class="result-stats">
          <span id="resultMoves">本关 0 步</span>
          <span id="resultBest">最佳 0 步</span>
        </div>
        <div class="result-actions">
          <button type="button" id="resultRestart">重玩</button>
          <button class="primary" type="button" id="resultNext">下一关</button>
        </div>
      </div>
    </div>
    <div class="settings-panel" id="settingsPanel" aria-hidden="true">
      <div class="settings-card" role="dialog" aria-modal="true" aria-label="游戏设置">
        <div class="settings-head">
          <p class="settings-title">设置</p>
          <button class="settings-close" type="button" id="settingsClose" title="关闭设置">关闭</button>
        </div>
        <div class="settings-tabs" aria-label="设置分类">
          <button type="button" id="settingsTabGame">关卡</button>
          <button type="button" id="settingsTabSound">声音</button>
          <button type="button" id="settingsTabTeaching">教学</button>
        </div>

      easy: { label: "简单", levels: LEVELS },
      hard: { label: "困难", levels: HARD_LEVELS }

    function validateLevel(level) {
      const counts = new Map();
      const capacities = new Set();
      level.bottles.map(normalizeBottle).forEach((bottle) => {
        capacities.add(bottle.capacity);
        bottle.colors.forEach((color) => {
          counts.set(color, (counts.get(color) || 0) + 1);
        });
      });
      const invalid = [...counts.entries()].filter(([, count]) => !capacities.has(count));
      if (invalid.length) {
        console.warn("关卡颜色数量可能不可通关：", level.title, invalid);
      }
    }

      return activeMode().levels;
    }

    function activeLevel() {
      return activeLevels()[state.levelIndex];
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function levelKey(index = state.levelIndex, mode = state.mode) {
      return `${mode}-${index}`;
    }

    function maxUnlocked(mode = state.mode) {
      const levels = MODES[mode].levels;
      const saved = Number(state.unlocked[mode]);
      return clamp(Number.isFinite(saved) ? saved : 0, 0, levels.length - 1);
    }

    function isLevelUnlocked(index, mode = state.mode) {
      if (mode === "easy") return true;
      return index <= maxUnlocked(mode);
    }

    function unlockNextLevel() {
      const next = state.levelIndex + 1;
      if (next < activeLevels().length) {
        state.unlocked[state.mode] = Math.max(maxUnlocked(), next);
      }
    }

      state.resultOpen = false;

        clearTimeout(state.resultAutoTimer);
        state.resultAutoTimer = null;
