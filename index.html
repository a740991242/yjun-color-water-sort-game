<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魔彩瓶：颜色倒水</title>
  <style>
    :root {
      color-scheme: light;
      --pink: #ed86b8;
      --pink-soft: #f6a6ca;
      --sky: #39aeea;
      --ink: #243044;
      --glass: rgba(255, 255, 255, 0.18);
      --app-height: 100svh;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: var(--pink);
      color: var(--ink);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: var(--app-height);
      overflow: hidden;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 14% 17%, rgba(255, 255, 255, 0.3) 0 18px, transparent 19px),
        radial-gradient(circle at 48% 15%, rgba(255, 255, 255, 0.23) 0 24px, transparent 25px),
        radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.24) 0 22px, transparent 23px),
        linear-gradient(180deg, #df7fb0 0%, var(--pink-soft) 66%, #48b9ef 66%, #34a8e5 100%);
    }

    .game-shell {
      width: min(100vw, 440px);
      height: min(var(--app-height), 780px);
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 12% 74%, rgba(255, 255, 255, 0.25) 0 21px, transparent 22px),
        radial-gradient(circle at 72% 78%, rgba(255, 255, 255, 0.2) 0 26px, transparent 27px),
        linear-gradient(180deg, var(--pink) 0%, var(--pink-soft) 72%, #48b8ee 72%, var(--sky) 100%);
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow: 0 24px 70px rgba(64, 42, 71, 0.24);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 16px 16px 8px;
      color: #fff;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
      text-shadow: 0 2px 10px rgba(98, 32, 69, 0.26);
    }

    .meta {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    .chip,
    .status {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.26);
      color: #fff;
      backdrop-filter: blur(8px);
    }

    .status {
      min-width: 92px;
      font-size: 13px;
      font-weight: 900;
      align-self: start;
    }

    canvas {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: block;
      touch-action: manipulation;
      cursor: pointer;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      padding: 12px 12px 16px;
      background: #39aeea;
      border-top: 3px solid rgba(29, 121, 184, 0.42);
    }

    @media (max-width: 540px) {
      body {
        place-items: start center;
      }

      .game-shell {
        width: 100vw;
        height: var(--app-height);
        max-height: var(--app-height);
        border: 0;
        box-shadow: none;
      }

      .topbar {
        padding: 12px 14px 6px;
      }

      .toolbar {
        padding: 9px 10px max(11px, env(safe-area-inset-bottom));
      }

      button {
        min-height: 40px;
      }
    }

    button {
      min-width: 0;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      color: #197dad;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(24, 121, 171, 0.28);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(24, 121, 171, 0.28);
    }

    button[disabled] {
      opacity: 0.45;
      cursor: default;
    }

    .toast {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 74px;
      min-height: 40px;
      display: grid;
      place-items: center;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      color: #a33f73;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(98, 32, 69, 0.16);
      opacity: 0;
      transform: translateY(-8px);
      transition: 180ms ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 380px) {
      .game-shell {
        height: var(--app-height);
      }

      h1 {
        font-size: 16px;
      }

      button {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <h1>魔彩瓶：请将相同颜色的水倒在一起</h1>
        <div class="meta">
          <span class="chip" id="moves">步数 0</span>
          <span class="chip" id="timer">不限时</span>
          <span class="chip" id="ruleTag">经典</span>
        </div>
      </div>
      <div class="status" id="status">第 1 关</div>
    </header>

    <canvas id="game" aria-label="颜色倒水游戏画布"></canvas>
    <div class="toast" id="toast"></div>

    <footer class="toolbar">
      <button type="button" id="undo" title="撤销上一步">撤销</button>
      <button type="button" id="restart" title="重新开始当前关">重开</button>
      <button type="button" id="music" title="开关背景音乐">音乐</button>
      <button type="button" id="sound" title="开关点击和倒水音效">音效</button>
      <button type="button" id="next" title="进入下一关">下一关</button>
    </footer>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const statusEl = document.querySelector("#status");
    const movesEl = document.querySelector("#moves");
    const timerEl = document.querySelector("#timer");
    const ruleTagEl = document.querySelector("#ruleTag");
    const toastEl = document.querySelector("#toast");
    const undoButton = document.querySelector("#undo");
    const restartButton = document.querySelector("#restart");
    const nextButton = document.querySelector("#next");
    const musicButton = document.querySelector("#music");
    const soundButton = document.querySelector("#sound");
    const WATER_AUDIO_URL = "assets/pour-water.mp3";

    const COLORS = {
      berry: "#7c4bd9",
      coral: "#ff6b6b",
      mint: "#45d18a",
      ocean: "#2296d5",
      orange: "#ff963a",
      moss: "#66a51f",
      navy: "#2c4dd8",
      slate: "#5e6a73",
      pink: "#fa79ad",
      lemon: "#f6ce45"
    };

    const LEVELS = [
      {
        title: "暖身空瓶",
        tag: "经典",
        bottles: [
          ["navy", "navy", "mint", "mint"],
          ["mint", "mint", "navy", "navy"],
          ["coral", "coral", "orange", "orange"],
          ["orange", "orange", "coral", "coral"],
          ["ocean", "ocean", "berry", "berry"],
          ["berry", "berry", "ocean", "ocean"],
          [],
          []
        ]
      },
      {
        title: "分层液体",
        tag: "分层",
        bottles: [
          ["mint", "coral", "mint", "berry"],
          ["orange", "ocean", "berry", "orange"],
          ["coral", "slate", "ocean", "mint"],
          ["berry", "orange", "slate", "coral"],
          ["ocean", "mint", "coral", "slate"],
          ["slate", "berry", "orange", "ocean"],
          [],
          []
        ]
      },
      {
        title: "窄口瓶",
        tag: "容量 3",
        bottles: [
          { colors: ["ocean", "mint", "berry"], capacity: 3 },
          { colors: ["berry", "orange", "ocean"], capacity: 3 },
          { colors: ["orange", "mint", "orange"], capacity: 3 },
          { colors: ["mint", "berry", "ocean"], capacity: 3 },
          { colors: [], capacity: 3 },
          { colors: [], capacity: 3 }
        ]
      },
      {
        title: "单向收集",
        tag: "特殊瓶",
        bottles: [
          ["navy", "orange", "mint", "pink"],
          ["pink", "mint", "navy", "orange"],
          ["orange", "pink", "mint", "navy"],
          ["mint", "navy", "orange", "pink"],
          { colors: [], capacity: 4, receiveOnly: true },
          { colors: [], capacity: 4, receiveOnly: true },
          []
        ]
      },
      {
        title: "限时闪拌",
        tag: "限时",
        time: 90,
        bottles: [
          ["berry", "lemon", "ocean", "coral"],
          ["ocean", "berry", "mint", "lemon"],
          ["mint", "coral", "lemon", "berry"],
          ["lemon", "mint", "coral", "ocean"],
          ["coral", "ocean", "berry", "mint"],
          [],
          []
        ]
      }
    ];

    function validateLevel(level) {
      const counts = new Map();
      const capacities = new Set();
      level.bottles.map(normalizeBottle).forEach((bottle) => {
        capacities.add(bottle.capacity);
        bottle.colors.forEach((color) => {
          counts.set(color, (counts.get(color) || 0) + 1);
        });
      });
      const invalid = [...counts.entries()].filter(([, count]) => !capacities.has(count));
      if (invalid.length) {
        console.warn("关卡颜色数量可能不可通关：", level.title, invalid);
      }
    }

    const state = {
      levelIndex: 0,
      bottles: [],
      selected: -1,
      moves: 0,
      history: [],
      layouts: [],
      animation: null,
      particles: [],
      celebration: null,
      finale: null,
      toastUntil: 0,
      message: "",
      completed: false,
      failed: false,
      musicOn: false,
      sfx: false,
      audio: null,
      timerStartedAt: 0,
      timeLeft: null,
      lastFrame: performance.now()
    };

    function normalizeBottle(input) {
      if (Array.isArray(input)) {
        return { colors: [...input], capacity: 4, receiveOnly: false, pourOnly: false };
      }
      return {
        colors: [...(input.colors || [])],
        capacity: input.capacity || 4,
        receiveOnly: Boolean(input.receiveOnly),
        pourOnly: Boolean(input.pourOnly)
      };
    }

    function loadLevel(index) {
      const level = LEVELS[index];
      validateLevel(level);
      stopWaterNoise(true);
      state.levelIndex = index;
      state.bottles = level.bottles.map(normalizeBottle);
      state.selected = -1;
      state.moves = 0;
      state.history = [];
      state.animation = null;
      state.particles = [];
      state.celebration = null;
      state.finale = null;
      state.completed = false;
      state.failed = false;
      state.timerStartedAt = performance.now();
      state.timeLeft = level.time || null;
      showToast(level.title);
      updateHud();
    }

    function snapshot() {
      return JSON.stringify({
        bottles: state.bottles,
        moves: state.moves,
        timeLeft: state.timeLeft,
        timerStartedAt: state.timerStartedAt
      });
    }

    function restore(data) {
      const parsed = JSON.parse(data);
      state.bottles = parsed.bottles;
      state.moves = parsed.moves;
      state.timeLeft = parsed.timeLeft;
      state.timerStartedAt = parsed.timerStartedAt;
      state.selected = -1;
      state.completed = false;
      state.failed = false;
      state.animation = null;
      state.celebration = null;
      state.finale = null;
      updateHud();
    }

    function updateHud() {
      const level = LEVELS[state.levelIndex];
      statusEl.textContent = `第 ${state.levelIndex + 1} 关`;
      movesEl.textContent = `步数 ${state.moves}`;
      timerEl.textContent = level.time ? `剩余 ${Math.max(0, Math.ceil(state.timeLeft || 0))}s` : "不限时";
      ruleTagEl.textContent = level.tag;
      undoButton.disabled = state.history.length === 0 || Boolean(state.animation);
      nextButton.disabled = state.levelIndex >= LEVELS.length - 1;
      musicButton.textContent = state.musicOn ? "音乐开" : "音乐关";
      soundButton.textContent = state.sfx ? "音效开" : "音效关";
    }

    function showToast(message) {
      state.message = message;
      state.toastUntil = performance.now() + 1500;
      toastEl.textContent = message;
      toastEl.classList.add("show");
    }

    function hideToastIfNeeded(now) {
      if (now > state.toastUntil) {
        toastEl.classList.remove("show");
      }
    }

    function syncAppHeight() {
      const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty("--app-height", `${Math.max(1, Math.floor(viewportHeight))}px`);
    }

    function resizeCanvas() {
      syncAppHeight();
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      computeLayout();
    }

    function computeLayout() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const count = state.bottles.length || 8;
      const columns = count > 7 ? 4 : 3;
      const rows = Math.ceil(count / columns);
      const gapX = width / columns;
      const bottleWidth = Math.min(58, Math.max(44, gapX * 0.5));
      const bottleHeight = Math.min(150, Math.max(118, height / rows * 0.58));
      const top = rows === 1 ? height * 0.28 : height * 0.14;
      const rowGap = rows === 1 ? 0 : Math.min(185, height / rows);

      state.layouts = state.bottles.map((_, index) => {
        const row = Math.floor(index / columns);
        const col = index % columns;
        const used = row === rows - 1 ? count - row * columns : columns;
        const offset = (columns - used) * gapX * 0.5;
        return {
          x: offset + gapX * col + gapX / 2,
          y: top + row * rowGap,
          width: bottleWidth,
          height: bottleHeight,
          shake: 0
        };
      });
    }

    function roundedRectPath(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
    }

    function drawBottle(bottle, layout, index, renderColors, options = {}) {
      const selected = state.selected === index;
      const invalidShake = layout.shake ? Math.sin(performance.now() / 26) * layout.shake : 0;
      const lift = selected ? -16 : 0;
      const celebration = getBottleCelebration(index);
      const x = layout.x + invalidShake + celebration.x;
      const y = layout.y + lift + celebration.y;
      const w = layout.width;
      const h = layout.height;
      const neckW = w * 0.48;
      const neckH = 16;
      const bodyX = x - w / 2;
      const bodyY = y + neckH;
      const bodyH = h - neckH;
      const innerPad = 5;
      const innerX = bodyX + innerPad;
      const innerY = bodyY + 10;
      const innerW = w - innerPad * 2;
      const innerH = bodyH - 16;
      const unitH = innerH / bottle.capacity;

      ctx.save();
      if (celebration.angle) {
        ctx.translate(x, y + h * 0.55);
        ctx.rotate(celebration.angle);
        ctx.translate(-x, -(y + h * 0.55));
      }
      ctx.shadowColor = selected ? "rgba(255,255,255,0.9)" : "rgba(80,40,80,0.18)";
      ctx.shadowBlur = selected ? 18 : 8;
      ctx.shadowOffsetY = selected ? 0 : 8;

      roundedRectPath(bodyX, bodyY, w, bodyH, 13);
      ctx.fillStyle = "rgba(255,255,255,0.12)";
      ctx.fill();
      ctx.lineWidth = selected ? 4 : 3;
      ctx.strokeStyle = selected ? "#fff7b8" : "rgba(255,255,255,0.94)";
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x - neckW / 2, y + neckH + 2);
      ctx.lineTo(x - neckW / 2, y + 5);
      ctx.quadraticCurveTo(x - neckW / 2, y, x - neckW / 2 + 5, y);
      ctx.lineTo(x + neckW / 2 - 5, y);
      ctx.quadraticCurveTo(x + neckW / 2, y, x + neckW / 2, y + 5);
      ctx.lineTo(x + neckW / 2, y + neckH + 2);
      ctx.strokeStyle = selected ? "#fff7b8" : "rgba(255,255,255,0.94)";
      ctx.lineWidth = selected ? 4 : 3;
      ctx.stroke();

      ctx.save();
      roundedRectPath(innerX, innerY, innerW, innerH, 8);
      ctx.clip();
      const colors = renderColors || bottle.colors;
      colors.forEach((colorKey, layerIndex) => {
        if (!colorKey) return;
        const fillY = innerY + innerH - unitH * (layerIndex + 1);
        ctx.fillStyle = COLORS[colorKey] || colorKey;
        ctx.fillRect(innerX, fillY + 1, innerW, unitH + 1);
        ctx.fillStyle = "rgba(255,255,255,0.13)";
        ctx.fillRect(innerX, fillY + 1, innerW, 4);
      });
      ctx.restore();

      ctx.beginPath();
      ctx.moveTo(bodyX + 11, bodyY + 18);
      ctx.lineTo(bodyX + 11, bodyY + 44);
      ctx.strokeStyle = "rgba(255,255,255,0.62)";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.stroke();

      if (!options.hideBadge) {
        if (bottle.receiveOnly) {
          drawBadge(x, bodyY + bodyH + 17, "入");
        }
        if (bottle.pourOnly) {
          drawBadge(x, bodyY + bodyH + 17, "出");
        }
        if (bottle.capacity < 4) {
          drawBadge(x, bodyY + bodyH + 17, "窄");
        }
      }
      ctx.restore();
    }

    function getBottleCelebration(index) {
      const celebration = state.celebration;
      if (!celebration || index < 0) return { x: 0, y: 0, angle: 0 };
      const bottle = state.bottles[index];
      if (!bottle || bottle.colors.length !== bottle.capacity) return { x: 0, y: 0, angle: 0 };
      const elapsed = performance.now() - celebration.startedAt;
      if (elapsed < 0 || elapsed > celebration.duration) return { x: 0, y: 0, angle: 0 };
      const progress = elapsed / celebration.duration;
      const envelope = Math.sin(Math.PI * progress);
      const wave = Math.sin(elapsed / 24 + index * 1.7);
      return {
        x: wave * 7 * envelope,
        y: -Math.abs(Math.sin(elapsed / 55 + index)) * 10 * envelope,
        angle: wave * 0.12 * envelope
      };
    }

    function drawBadge(x, y, text) {
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.strokeStyle = "rgba(36,48,68,0.18)";
      ctx.lineWidth = 1;
      roundedRectPath(x - 13, y - 10, 26, 20, 7);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#197dad";
      ctx.font = "800 12px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y + 1);
      ctx.restore();
    }

    function drawPourAnimation() {
      if (!state.animation) return;
      const anim = state.animation;
      const source = state.layouts[anim.from];
      const target = state.layouts[anim.to];
      const raw = Math.min(1, anim.elapsed / anim.duration);
      const travel = easeInOut(Math.min(1, raw / 0.28));
      const pour = easeInOut(Math.max(0, Math.min(1, (raw - 0.2) / 0.56)));
      const returnBack = easeInOut(Math.max(0, Math.min(1, (raw - 0.78) / 0.22)));
      const scale = 0.78;
      const sideGap = target.width * 1.35;
      const perchY = Math.max(18, Math.min(target.y - target.height * 0.82, canvas.clientHeight - target.height * 1.1));
      const defaultSide = source.x <= target.x ? -1 : 1;
      const sideChoices = [-1, 1].map((side) => {
        const x = Math.max(
          source.width * 0.8,
          Math.min(canvas.clientWidth - source.width * 0.8, target.x + side * sideGap)
        );
        const overlapPenalty = state.layouts.reduce((score, layout, index) => {
          if (index === anim.from || index === anim.to) return score;
          const dx = Math.abs(layout.x - x);
          const dy = Math.abs(layout.y - perchY);
          if (dx < source.width * 1.25 && dy < source.height * 1.05) return score + 10;
          if (dx < source.width * 1.6 && dy < source.height * 1.25) return score + 3;
          return score;
        }, 0);
        const edgePenalty = x < source.width || x > canvas.clientWidth - source.width ? 2 : 0;
        const preferencePenalty = side === defaultSide ? 0 : 1;
        return { side, x, score: overlapPenalty + edgePenalty + preferencePenalty };
      }).sort((a, b) => a.score - b.score);
      const bottleSide = sideChoices[0].side;
      const perchX = Math.max(
        source.width * 0.8,
        Math.min(canvas.clientWidth - source.width * 0.8, sideChoices[0].x)
      );
      const moveX = source.x + (perchX - source.x) * travel;
      const moveY = source.y + (perchY - source.y) * travel - Math.sin(Math.PI * travel) * 24;
      const settleX = moveX + (source.x - moveX) * returnBack;
      const settleY = moveY + (source.y - moveY) * returnBack;
      const angle = -bottleSide * 0.86 * pour * (1 - returnBack);
      const bottle = state.bottles[anim.from];

      ctx.save();
      ctx.translate(settleX, settleY);
      ctx.rotate(angle);
      ctx.globalAlpha = 0.94;
      drawBottle(
        bottle,
        { x: 0, y: 0, width: source.width * scale, height: source.height * scale },
        -99,
        null,
        { hideBadge: true }
      );
      ctx.restore();

      if (pour > 0.08 && raw < 0.82) {
        const startX = settleX - bottleSide * source.width * 0.43;
        const startY = settleY + source.height * 0.28;
        const endX = target.x;
        const endY = target.y + target.height * 0.36;
        ctx.save();
        ctx.strokeStyle = COLORS[anim.color];
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.globalAlpha = 0.78;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo((startX + endX) / 2, Math.min(startY, endY) + 42, endX, endY);
        ctx.stroke();
        ctx.restore();

        if (Math.random() < 0.42) {
          state.particles.push({
            x: endX + (Math.random() - 0.5) * 12,
            y: endY + (Math.random() - 0.5) * 8,
            r: 1.5 + Math.random() * 1.8,
            vy: 0.6 + Math.random() * 1.3,
            life: 22,
            color: COLORS[anim.color]
          });
        }
      }
    }

    function drawParticles() {
      state.particles = state.particles.filter((p) => p.life > 0);
      state.particles.forEach((p) => {
        p.life -= 1;
        p.x += p.vx || 0;
        p.y += p.vy;
        if (p.gravity) p.vy += p.gravity;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / (p.maxLife || 28));
        ctx.fillStyle = p.color;
        if (p.kind === "petal") {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.spin || 0);
          roundedRectPath(-p.r * 1.2, -p.r * 0.55, p.r * 2.4, p.r * 1.1, p.r * 0.55);
          ctx.fill();
          p.spin = (p.spin || 0) + (p.spinSpeed || 0.08);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
    }

    function startCelebration() {
      const now = performance.now();
      state.celebration = { startedAt: now, duration: 1180 };
      state.bottles.forEach((bottle, index) => {
        if (bottle.colors.length !== bottle.capacity || !state.layouts[index]) return;
        const layout = state.layouts[index];
        const topColor = bottle.colors[bottle.colors.length - 1];
        for (let i = 0; i < 14; i += 1) {
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.45;
          const speed = 2.2 + Math.random() * 3.2;
          const life = 36 + Math.random() * 22;
          state.particles.push({
            x: layout.x + (Math.random() - 0.5) * layout.width * 0.5,
            y: layout.y + 10,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.13,
            r: 1.8 + Math.random() * 2.2,
            life,
            maxLife: life,
            color: Math.random() < 0.35 ? "#ffffff" : COLORS[topColor]
          });
        }
      });
    }

    function startFinale() {
      const now = performance.now();
      state.particles = state.particles.filter((p) => p.kind === "petal");
      state.finale = { startedAt: now, duration: Infinity, lastPetalAt: 0 };
      addFinalePetals(90);
    }

    function addFinalePetals(count) {
      const petalColors = ["#ff5ca8", "#fff3a3", "#65e6a3", "#58c7ff", "#b983ff", "#ff9b54", "#ffffff"];
      for (let i = 0; i < count; i += 1) {
        const delay = Math.random() * 600;
        const life = 110 + Math.random() * 70;
        state.particles.push({
          kind: "petal",
          x: Math.random() * canvas.clientWidth,
          y: -20 - delay * 0.08,
          vx: (Math.random() - 0.5) * 1.8,
          vy: 1.2 + Math.random() * 2.2,
          gravity: 0.012,
          r: 3 + Math.random() * 3.5,
          spin: Math.random() * Math.PI,
          spinSpeed: (Math.random() - 0.5) * 0.25,
          life,
          maxLife: life,
          color: petalColors[Math.floor(Math.random() * petalColors.length)]
        });
      }
    }

    function drawFinale(now) {
      if (!state.finale) return;
      const elapsed = now - state.finale.startedAt;
      const reveal = easeInOut(Math.min(1, elapsed / 900));
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const cx = w / 2;
      const rainbowTop = Math.max(104, h * 0.18);
      const baseY = Math.min(h * 0.56, rainbowTop + h * 0.34);
      const radiusX = Math.min(w * 0.44, 190);
      const radiusY = baseY - rainbowTop;
      const stripeWidth = Math.max(8, Math.min(12, w * 0.024));
      const stripeGap = stripeWidth * 0.92;
      const rainbow = ["#ff526f", "#ff9747", "#ffe66d", "#53dd7d", "#3fd5f4", "#4f73ff", "#b867ff"];

      if (now - state.finale.lastPetalAt > 170) {
        addFinalePetals(8);
        state.finale.lastPetalAt = now;
      }

      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = stripeWidth * 7.7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.ellipse(cx, baseY, radiusX + stripeWidth * 2.4, radiusY + stripeWidth * 2.4, 0, Math.PI, Math.PI + Math.PI * reveal);
      ctx.stroke();

      ctx.globalAlpha = 0.98;
      ctx.shadowColor = "rgba(255,255,255,0.62)";
      ctx.shadowBlur = 16;
      rainbow.forEach((color, index) => {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = stripeWidth;
        ctx.lineCap = "round";
        const offset = index * stripeGap;
        const start = Math.PI;
        const end = Math.PI + Math.PI * reveal;
        ctx.ellipse(cx, baseY + offset, radiusX - offset * 0.9, radiusY - offset * 0.62, 0, start, end);
        ctx.stroke();
      });
      ctx.shadowBlur = 0;

      const textPulse = 1 + Math.sin(elapsed / 180) * 0.035;
      const textY = Math.min(h - 92, baseY + stripeGap * rainbow.length + 72);
      ctx.translate(cx, textY);
      ctx.scale(textPulse, textPulse);
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      roundedRectPath(-124, -34, 248, 68, 8);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,92,168,0.35)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#e8428d";
      ctx.font = "900 30px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("恭喜通关", 0, -6);
      ctx.fillStyle = "#197dad";
      ctx.font = "800 13px sans-serif";
      ctx.fillText("撒花完结", 0, 22);
      ctx.restore();
    }

    function drawBackgroundHearts() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.save();
      ctx.globalAlpha = 0.23;
      ctx.fillStyle = "#fff";
      [[38, 64, 0.85], [198, 36, 1], [334, 58, 0.9], [90, h - 72, 0.8], [300, h - 92, 0.75]].forEach(([x, y, s]) => {
        drawHeart(Math.min(w - 24, x), y, s);
      });
      ctx.restore();
    }

    function drawHeart(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.beginPath();
      ctx.moveTo(0, 12);
      ctx.bezierCurveTo(-28, -8, -12, -28, 0, -12);
      ctx.bezierCurveTo(12, -28, 28, -8, 0, 12);
      ctx.fill();
      ctx.restore();
    }

    function render(now) {
      const dt = Math.min(50, now - state.lastFrame);
      state.lastFrame = now;
      tickTimer(dt);
      hideToastIfNeeded(now);

      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      drawBackgroundHearts();

      state.layouts.forEach((layout) => {
        layout.shake *= 0.9;
        if (layout.shake < 0.2) layout.shake = 0;
      });

      if (!state.finale) {
        state.bottles.forEach((bottle, index) => {
          if (state.animation && index === state.animation.from) return;
          drawBottle(bottle, state.layouts[index], index);
        });

        if (state.animation) {
          state.animation.elapsed += dt;
          drawPourAnimation();
          if (state.animation.elapsed >= state.animation.duration) {
            finishPour();
          }
        }
      }

      drawParticles();
      drawFinale(now);
      requestAnimationFrame(render);
    }

    function tickTimer(dt) {
      const level = LEVELS[state.levelIndex];
      if (!level.time || state.completed || state.failed) return;
      state.timeLeft -= dt / 1000;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        state.failed = true;
        showToast("时间到，重开试试");
        playTone(140, 0.18, "sawtooth");
      }
      updateHud();
    }

    function topRun(bottle) {
      if (!bottle.colors.length) return null;
      const color = bottle.colors[bottle.colors.length - 1];
      let amount = 0;
      for (let i = bottle.colors.length - 1; i >= 0; i -= 1) {
        if (bottle.colors[i] !== color) break;
        amount += 1;
      }
      return { color, amount };
    }

    function canPour(from, to) {
      if (from === to) return { ok: false, reason: "换一个瓶子倒" };
      const source = state.bottles[from];
      const target = state.bottles[to];
      if (!source || !target) return { ok: false, reason: "没有这个瓶子" };
      if (state.failed || state.completed) return { ok: false, reason: "当前关已结束" };
      if (!source.colors.length) return { ok: false, reason: "空瓶不能倒出" };
      if (source.receiveOnly) return { ok: false, reason: "这个瓶子只能接水" };
      if (target.pourOnly) return { ok: false, reason: "这个瓶子只能倒出" };
      const space = target.capacity - target.colors.length;
      if (space <= 0) return { ok: false, reason: "目标瓶满了" };
      const run = topRun(source);
      const targetTop = target.colors[target.colors.length - 1];
      if (targetTop && targetTop !== run.color) return { ok: false, reason: "只能倒到同色或空瓶" };
      return {
        ok: true,
        color: run.color,
        amount: Math.min(run.amount, space)
      };
    }

    function startPour(from, to, move) {
      state.history.push(snapshot());
      state.moves += 1;
      state.selected = -1;
      state.animation = {
        from,
        to,
        color: move.color,
        amount: move.amount,
        elapsed: 0,
        duration: 3000
      };
      startWaterNoise();
      updateHud();
    }

    function finishPour() {
      const anim = state.animation;
      const source = state.bottles[anim.from];
      const target = state.bottles[anim.to];
      for (let i = 0; i < anim.amount; i += 1) {
        target.colors.push(source.colors.pop());
      }
      state.animation = null;
      stopWaterNoise();
      if (isComplete()) {
        state.completed = true;
        const hasNextLevel = state.levelIndex < LEVELS.length - 1;
        showToast(hasNextLevel ? "通关！自动进入下一关" : "恭喜通关！");
        startCelebration();
        if (!hasNextLevel) {
          startFinale();
        }
        playTone(660, 0.12, "sine");
        setTimeout(() => playTone(880, 0.14, "sine"), 120);
        if (hasNextLevel) {
          setTimeout(() => {
            if (state.completed && !state.animation) {
              loadLevel(state.levelIndex + 1);
            }
          }, 1350);
        }
      }
      updateHud();
    }

    function isComplete() {
      return state.bottles.every((bottle) => {
        if (bottle.colors.length === 0) return true;
        if (bottle.colors.length !== bottle.capacity) return false;
        return bottle.colors.every((color) => color === bottle.colors[0]);
      });
    }

    function handleCanvasClick(event) {
      if (state.animation) return;
      unlockAudio();
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const hit = hitTest(x, y);
      if (hit < 0) return;

      if (state.selected < 0) {
        if (!state.bottles[hit].colors.length) {
          bump(hit, "先选有液体的瓶子");
          return;
        }
        state.selected = hit;
        playTone(460, 0.045, "sine");
        return;
      }

      if (state.selected === hit) {
        state.selected = -1;
        playTone(330, 0.04, "sine");
        return;
      }

      const move = canPour(state.selected, hit);
      if (!move.ok) {
        bump(hit, move.reason);
        return;
      }
      startPour(state.selected, hit, move);
    }

    function hitTest(x, y) {
      for (let i = state.layouts.length - 1; i >= 0; i -= 1) {
        const box = state.layouts[i];
        const left = box.x - box.width / 2 - 12;
        const top = box.y - 12;
        const right = box.x + box.width / 2 + 12;
        const bottom = box.y + box.height + 30;
        if (x >= left && x <= right && y >= top && y <= bottom) return i;
      }
      return -1;
    }

    function bump(index, reason) {
      state.selected = -1;
      if (state.layouts[index]) state.layouts[index].shake = 7;
      showToast(reason);
      playTone(190, 0.08, "square");
    }

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function unlockAudio() {
      if (!state.audio) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        state.audio = { ctx: new AudioContext(), water: null, music: null, waterFile: null };
      }
      if (state.audio.ctx.state === "suspended") {
        state.audio.ctx.resume();
      }
    }

    function playTone(freq, duration, type) {
      if (!state.sfx) return;
      unlockAudio();
      if (!state.audio) return;
      const audioCtx = state.audio.ctx;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = type;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration + 0.02);
    }

    function startWaterNoise() {
      if (!state.sfx) return;
      unlockAudio();
      if (!state.audio || state.audio.water) return;
      if (!state.audio.waterFile) {
        state.audio.waterFile = new Audio(WATER_AUDIO_URL);
        state.audio.waterFile.preload = "auto";
        state.audio.waterFile.loop = true;
      }

      const audio = state.audio.waterFile;
      audio.currentTime = 0;
      audio.volume = 0;
      const fadeTimer = setInterval(() => {
        audio.volume = Math.min(0.82, audio.volume + 0.12);
        if (audio.volume >= 0.82) clearInterval(fadeTimer);
      }, 28);
      state.audio.water = { kind: "file", audio, fadeTimer, startedAt: performance.now(), minPlayMs: 3000 };

      audio.play().catch(() => {
        clearInterval(fadeTimer);
        state.audio.water = null;
        startGeneratedWaterNoise();
      });
    }

    function startGeneratedWaterNoise() {
      if (!state.sfx) return;
      unlockAudio();
      if (!state.audio || state.audio.water) return;
      const audioCtx = state.audio.ctx;
      const master = audioCtx.createGain();
      master.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      master.gain.exponentialRampToValueAtTime(0.072, audioCtx.currentTime + 0.1);
      master.connect(audioCtx.destination);

      const makeNoiseSource = (seconds) => {
        const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * seconds), audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        let last = 0;
        for (let i = 0; i < data.length; i += 1) {
          const white = Math.random() * 2 - 1;
          last = last * 0.72 + white * 0.28;
          data[i] = last;
        }
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        return source;
      };

      const stream = makeNoiseSource(1.6);
      const streamFilter = audioCtx.createBiquadFilter();
      const streamGain = audioCtx.createGain();
      streamFilter.type = "bandpass";
      streamFilter.frequency.value = 520;
      streamFilter.Q.value = 0.55;
      streamGain.gain.value = 0.48;
      stream.connect(streamFilter);
      streamFilter.connect(streamGain);
      streamGain.connect(master);

      const fizz = makeNoiseSource(0.55);
      const fizzFilter = audioCtx.createBiquadFilter();
      const fizzGain = audioCtx.createGain();
      fizzFilter.type = "lowpass";
      fizzFilter.frequency.value = 1600;
      fizzGain.gain.value = 0.035;
      fizz.connect(fizzFilter);
      fizzFilter.connect(fizzGain);
      fizzGain.connect(master);

      const gurgle = audioCtx.createOscillator();
      const gurgleFilter = audioCtx.createBiquadFilter();
      const gurgleGain = audioCtx.createGain();
      gurgle.type = "sine";
      gurgle.frequency.setValueAtTime(58, audioCtx.currentTime);
      gurgle.frequency.linearRampToValueAtTime(74, audioCtx.currentTime + 0.28);
      gurgleFilter.type = "lowpass";
      gurgleFilter.frequency.value = 120;
      gurgleGain.gain.value = 0.075;
      gurgle.connect(gurgleFilter);
      gurgleFilter.connect(gurgleGain);
      gurgleGain.connect(master);

      const dripTimer = setInterval(() => {
        if (!state.audio || !state.audio.water) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        const bubbleFreq = 74 + Math.random() * 54;
        osc.type = "sine";
        osc2.type = "sine";
        osc.frequency.setValueAtTime(bubbleFreq, t);
        osc.frequency.exponentialRampToValueAtTime(bubbleFreq * 0.58, t + 0.16);
        osc2.frequency.setValueAtTime(bubbleFreq * 1.48, t);
        osc2.frequency.exponentialRampToValueAtTime(bubbleFreq * 0.82, t + 0.13);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(210, t);
        filter.frequency.exponentialRampToValueAtTime(95, t + 0.2);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.035 + Math.random() * 0.02, t + 0.024);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        osc.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        osc.start(t);
        osc2.start(t);
        osc.stop(t + 0.2);
        osc2.stop(t + 0.2);
      }, 180);

      stream.start();
      fizz.start();
      gurgle.start();
      state.audio.water = { kind: "generated", sources: [stream, fizz, gurgle], gain: master, dripTimer };
    }

    function stopWaterNoise(force = false) {
      if (!state.audio || !state.audio.water) return;
      const water = state.audio.water;
      state.audio.water = null;
      if (water.kind === "file") {
        const { audio, fadeTimer, startedAt, minPlayMs } = water;
        clearInterval(fadeTimer);
        const remaining = force ? 0 : Math.max(0, minPlayMs - (performance.now() - startedAt));
        setTimeout(() => {
          fadeOutWaterFile(audio);
        }, remaining);
        return;
      }

      const { sources, gain, dripTimer } = water;
      clearInterval(dripTimer);
      gain.gain.exponentialRampToValueAtTime(0.0001, state.audio.ctx.currentTime + 0.08);
      setTimeout(() => {
        sources.forEach((source) => {
          try {
            source.stop();
          } catch (error) {
            // Source may already be stopped if the browser cleaned up the node.
          }
        });
      }, 120);
    }

    function fadeOutWaterFile(audio) {
      if (audio.paused) return;
      const fadeOut = setInterval(() => {
        audio.volume = Math.max(0, audio.volume - 0.16);
        if (audio.volume <= 0) {
          clearInterval(fadeOut);
          audio.pause();
          audio.currentTime = 0;
        }
      }, 24);
    }

    function startBackgroundMusic() {
      if (!state.musicOn) return;
      unlockAudio();
      if (!state.audio || state.audio.music) return;
      const audioCtx = state.audio.ctx;
      const master = audioCtx.createGain();
      master.gain.value = 0.14;
      master.connect(audioCtx.destination);
      const music = {
        master,
        timers: [],
        sources: [],
        step: 0,
        stopped: false,
        tempo: 132,
        notes: [392, 466.16, 523.25, 466.16, 392, 311.13, 349.23, 392],
        bass: [98, 98, 116.54, 98, 130.81, 116.54, 98, 77.78]
      };
      state.audio.music = music;

      const beatMs = 60000 / music.tempo;
      const playBlip = (freq, time, duration, volume, type = "square") => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, time);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1200, time);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(volume, time + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        osc.start(time);
        osc.stop(time + duration + 0.03);
      };

      const playTick = (time, strong) => {
        const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.045), audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i += 1) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        }
        const src = audioCtx.createBufferSource();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        src.buffer = buffer;
        filter.type = "bandpass";
        filter.frequency.value = strong ? 520 : 980;
        filter.Q.value = 1.2;
        gain.gain.setValueAtTime(strong ? 0.07 : 0.035, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        src.start(time);
      };

      const scheduleStep = () => {
        if (!state.audio || state.audio.music !== music || music.stopped) return;
        const now = audioCtx.currentTime + 0.025;
        const step = music.step % music.notes.length;
        const note = music.notes[step];
        const bass = music.bass[step];
        playBlip(note, now, 0.16, 0.095, step % 2 ? "triangle" : "square");
        playBlip(note * 1.5, now + 0.055, 0.07, 0.03, "sine");
        playBlip(bass, now, 0.13, step % 2 === 0 ? 0.06 : 0.038, "triangle");
        playTick(now, step === 0 || step === 4);
        music.step += 1;
        music.timers.push(setTimeout(scheduleStep, beatMs / 2));
      };

      scheduleStep();
    }

    function stopBackgroundMusic() {
      if (!state.audio || !state.audio.music) return;
      const music = state.audio.music;
      music.stopped = true;
      music.timers.forEach((timer) => clearTimeout(timer));
      music.master.gain.exponentialRampToValueAtTime(0.0001, state.audio.ctx.currentTime + 0.12);
      setTimeout(() => {
        music.sources.forEach((source) => {
          try {
            source.stop();
          } catch (error) {
            // Continuous music source may already be stopped.
          }
        });
      }, 140);
      state.audio.music = null;
    }

    canvas.addEventListener("click", handleCanvasClick);
    undoButton.addEventListener("click", () => {
      if (!state.history.length || state.animation) return;
      restore(state.history.pop());
      showToast("已撤销一步");
    });
    restartButton.addEventListener("click", () => loadLevel(state.levelIndex));
    nextButton.addEventListener("click", () => {
      const next = Math.min(LEVELS.length - 1, state.levelIndex + 1);
      loadLevel(next);
    });
    musicButton.addEventListener("click", () => {
      state.musicOn = !state.musicOn;
      unlockAudio();
      if (state.musicOn) {
        startBackgroundMusic();
      } else {
        stopBackgroundMusic();
      }
      showToast(state.musicOn ? "背景音乐已开启" : "背景音乐已关闭");
      updateHud();
    });
    soundButton.addEventListener("click", () => {
      state.sfx = !state.sfx;
      unlockAudio();
      if (!state.sfx) {
        stopWaterNoise(true);
      }
      showToast(state.sfx ? "倒水音效已开启" : "倒水音效已关闭");
      updateHud();
    });
    window.addEventListener("resize", () => {
      resizeCanvas();
    });
    window.addEventListener("orientationchange", () => {
      requestAnimationFrame(resizeCanvas);
      setTimeout(resizeCanvas, 250);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resizeCanvas);
      window.visualViewport.addEventListener("scroll", resizeCanvas);
    }

    loadLevel(0);
    syncAppHeight();
    resizeCanvas();
    requestAnimationFrame(resizeCanvas);
    setTimeout(resizeCanvas, 250);
    requestAnimationFrame(render);
  </script>
</body>
</html>
